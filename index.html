<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Cadastro com Regex</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        form { max-width: 600px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        fieldset { border: 1px solid #ccc; border-radius: 5px; margin-bottom: 20px; padding: 15px; }
        legend { font-weight: bold; background: #fff; padding: 0 5px; }
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 14px; }
        input { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        
        input:focus:invalid { border-color: red; outline: none; box-shadow: 0 0 5px red; }
        input:focus:valid { border-color: green; outline: none; box-shadow: 0 0 5px green; }
        
        button { background-color: #28a745; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 5px; font-size: 16px; width: 100%; margin-top: 10px; }
        button:hover { background-color: #218838; }
        small { color: #666; font-size: 11px; }
    </style>
</head>
<body>

    <form action="#" method="POST">
        
        <fieldset>
            <legend>Dados Pessoais Básicos</legend>
            
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" required>

            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" placeholder="000.000.000-00" title="Formato: 000.000.000-00" required>
            <small>Ex: 123.456.789-00</small>

            <label for="rg">RG</label>
            <input type="text" id="rg" name="rg" placeholder="Apenas números ou formato do estado" required>

            <label for="nascimento">Data de Nascimento</label>
            <input type="text" id="nascimento" name="nascimento" pattern="(0[1-9]|[12][0-9]|3[01])/(0[1-9]|1[0-2])/\d{4}" placeholder="DD/MM/AAAA" title="Formato: DD/MM/AAAA" required>
            <small>Ex: 25/12/1990</small>

            <label for="tipoSanguineo">Tipo Sanguíneo</label>
            <input type="text" id="tipoSanguineo" name="tipoSanguineo" pattern="(A|B|AB|O)[+-]" placeholder="A+, O-, AB+" title="Formato: A+, B-, O+, etc" required>
        </fieldset>

        <fieldset>
            <legend>Contato e Endereço</legend>

            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" pattern="\(?\d{2}\)?\s?\d{4,5}-?\d{4}" placeholder="(00) 00000-0000" title="Formato: (99) 99999-9999" required>
            
            <label for="email">E-mail Comum</label>
            <input type="email" id="email" name="email" placeholder="exemplo@gmail.com" required>

            <label for="emailFmp">E-mail da FMP</label>
            <input type="email" id="emailFmp" name="emailFmp" pattern="^[a-zA-Z0-9._%+-]+@fmp\.edu\.br$" placeholder="aluno@fmp.edu.br" title="Deve terminar com @fmp.edu.br" required>

            <label for="endereco">Endereço</label>
            <input type="text" id="endereco" name="endereco" required>

            <label for="cep">CEP</label>
            <input type="text" id="cep" name="cep" pattern="\d{5}-\d{3}" placeholder="00000-000" title="Formato: 00000-000" required>
        </fieldset>

        <fieldset>
            <legend>Dados Institucionais e Veiculares</legend>

            <label for="matricula">Matrícula</label>
            <input type="text" id="matricula" name="matricula" pattern="\d+" placeholder="Apenas números" required>

            <label for="placa">Placa de Carro (Mercosul)</label>
            <input type="text" id="placa" name="placa" pattern="[A-Z]{3}\d[A-Z]\d{2}" placeholder="ABC1D23" title="Formato Mercosul: 3 letras, 1 número, 1 letra, 2 números" required>
        </fieldset>

        <fieldset>
            <legend>Dados Fiscais e Vendas (Específicos)</legend>

            <label for="cnpj">CNPJ</label>
            <input type="text" id="cnpj" name="cnpj" pattern="\d{2}\.\d{3}\.\d{3}/\d{4}-\d{2}" placeholder="00.000.000/0000-00" title="Formato: 00.000.000/0000-00">

            <label for="inscricaoEstadual">Inscrição Estadual</label>
            <input type="text" id="inscricaoEstadual" name="inscricaoEstadual" pattern="\d+" placeholder="Apenas números">

            <label for="cartao">Número do Cartão</label>
            <input type="text" id="cartao" name="cartao" pattern="\d{4}\s\d{4}\s\d{4}\s\d{4}" placeholder="0000 0000 0000 0000" title="16 dígitos separados por espaço">

            <label for="validadeCartao">Validade do Cartão (MM/AA)</label>
            <input type="text" id="validadeCartao" name="validadeCartao" pattern="(0[1-9]|1[0-2])/\d{2}" placeholder="MM/AA" title="Formato: MM/AA">

            <label for="cvv">CVV</label>
            <input type="text" id="cvv" name="cvv" pattern="\d{3,4}" placeholder="123" title="3 ou 4 dígitos">

            <label for="lotePeixe">Lote de Venda de Peixes</label>
            <!-- Considerando um padrão fictício LOTE-1234 para exemplificar a Regex de lote -->
            <input type="text" id="lotePeixe" name="lotePeixe" pattern="LOTE-\d{4}" placeholder="LOTE-0000" title="Formato: LOTE- seguido de 4 números">

            <label for="latLong">Latitude e Longitude</label>
            <input type="text" id="latLong" name="latLong" pattern="^-?\d{1,2}\.\d+,\s?-?\d{1,3}\.\d+$" placeholder="-23.5505, -46.6333" title="Formato: lat, long (em decimais)">

            <label for="codigoBarras">Código de Barras</label>
            <input type="text" id="codigoBarras" name="codigoBarras" pattern="\d{13}" placeholder="13 dígitos numéricos" title="Formato EAN-13 (13 números)">
        </fieldset>

        <button type="submit">Enviar Cadastro</button>
    </form>

</body>
</html>
